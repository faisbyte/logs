name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm comes from the packageManager field in package.json.
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      # Build, then every test. Live API tests skip themselves: no DIGEST_LIVE_TESTS, DIGEST_EVAL or API key here.
      - run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
      # Job logs need a sign-in to read, annotations don't: on failure, repeat the end of the output as one.
      - if: failure()
        run: |
          message=$( (grep -E 'FAIL|Error|error TS|Unhandled|timed out' test-output.log | head -n 40; echo '---'; tail -n 40 test-output.log) | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pnpm test failed::${message}"

  # The dashboard end to end: a seeded throwaway digest server and the built dashboard, driven by Playwright in Chromium,
  # with axe in both themes. Nothing is deployed; both run on localhost inside the job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter @digest/web build
      - run: pnpm --filter @digest/web exec playwright install --with-deps chromium
      - run: |
          set -o pipefail
          pnpm --filter @digest/web e2e 2>&1 | tee e2e-output.log
      - if: failure()
        run: |
          message=$( (grep -E '✘|Error|Expected|Received|timed out' e2e-output.log | head -n 40; echo '---'; tail -n 40 e2e-output.log) | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=e2e failed::${message}"
      # Traces of failed tests (kept by playwright.config.ts), to open with `playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: apps/web/test-results/
          retention-days: 7
